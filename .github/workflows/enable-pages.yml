name: Enable GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const result = await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow',
                source: {
                  branch: 'main',
                  path: '/'
                }
              });
              console.log('GitHub Pages enabled:', result.data);
            } catch (err) {
              if (err.status === 409) {
                console.log('GitHub Pages already enabled');
              } else {
                console.error('Error enabling Pages:', err.message);
                throw err;
              }
            }
