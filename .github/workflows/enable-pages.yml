name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read
  repositories: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = context.repo.full_name.split('/');
            const response = await github.request('POST /repos/{owner}/{repo}/pages', {
              owner: owner,
              repo: repo,
              source: {
                branch: 'main',
                path: '/'
              }
            }).catch(err => {
              if (err.status === 409) {
                console.log('Pages already enabled');
                return null;
              }
              throw err;
            });
            console.log('GitHub Pages enabled:', response);
